<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        :root {
            --app-font-family: Aptos, Arial, sans-serif;
            --app-font-size: 14px;
        }

        html {
            font-size: var(--app-font-size);
        }

        body,
        button,
        input,
        select,
        textarea,
        table,
        .card,
        .btn,
        .badge,
        .form-control,
        .form-select,
        .accordion-button,
        .navbar,
        .dropdown-menu {
            font-family: var(--app-font-family);
            font-size: inherit;
        }

        body {
            font-family: var(--app-font-family);
            font-size: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        h3 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        h4 {
            font-size: 1.15rem;
            font-weight: 700;
        }

        h5 {
            font-size: 1rem;
            font-weight: 700;
        }

        h6 {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .form-apuesta {
            font-size: 0.78rem;
        }

        .form-apuesta .form-control,
        .form-apuesta .form-select,
        .form-apuesta input,
        .form-apuesta select {
            font-size: 0.78rem;
            height: 30px;
            padding: 3px 6px;
        }

        .form-apuesta .form-label {
            font-size: 0.76rem;
            font-weight: 700;
        }

        .equipo-label {
            width: 65px;
            min-width: 65px;
        }

        .table th,
        .table td {
            text-align: center;
            vertical-align: middle;
        }

        .table th {
            white-space: nowrap;
        }

        .table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .marcador-box {
            min-width: 110px;
        }

        .match-card {
            min-height: 220px;
            border: 1px solid #dfe5ec;
            border-radius: 8px;
            background: #f8fbfd;
        }

        .match-card hr {
            margin: 10px 0;
        }

        .scorers-toggle {
            font-size: 0.66rem;
            padding: 3px 5px !important;
            min-height: 26px;
        }

        .scorers-toggle span {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            line-height: 1;
        }

        .scorers-toggle-button {
            width: 24px;
            height: 22px;
            padding: 0 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .scorers-toggle-button i {
            font-size: 0.7rem;
            line-height: 1;
        }

        .match-header {
            display: grid;
            grid-template-columns: minmax(70px, 1fr) auto minmax(70px, 1fr);
            align-items: center;
            gap: 6px;
            min-height: 58px;
        }

        .score-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-width: 95px;
        }

        .scorers-row {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 10px;
            align-items: stretch;
            border-top: 1px solid #dee2e6;
            padding-top: 10px;
            margin-top: 8px;
        }

        .scorers-separator {
            background: #adb5bd;
            width: 1px;
        }

        .scorer-line {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 30px;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }

        .scorer-name,
        .sin-goleadores {
            font-size: 0.66rem;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .scorer-input {
            width: 30px !important;
            height: 28px !important;
            min-height: 28px !important;
            padding: 0 !important;
            text-align: center;
            font-weight: 600;
            font-size: 0.68rem !important;
            line-height: 1 !important;
            appearance: textfield;
        }

        .scorer-input::-webkit-outer-spin-button,
        .scorer-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .accordion-button {
            background: #0d6efd;
            color: white;
            font-weight: 700;
            padding: 8px 16px;
            min-height: 38px;
            font-size: 0.9rem;
        }

        .accordion-button:not(.collapsed) {
            background: #0d6efd;
            color: white;
        }

        .accordion-button::after {
            filter: brightness(0) invert(1);
        }

        .match-top-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 18px;
            margin-bottom: 10px;
        }

        .match-date {
            font-size: 0.68rem;
            font-weight: 700;
            color: #6c757d;
            line-height: 1;
        }

        .status-dot {
            font-size: 0.85rem;
            line-height: 1;
            display: flex;
            align-items: center;
        }

        .status-ok {
            color: #198754;
        }

        .status-pending {
            color: #ffc107;
        }

        .match-score-line {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 32px 32px minmax(0, 1fr);
            gap: 5px;
            align-items: center;
            margin-bottom: 12px;
        }

        .team-name {
            font-size: 0.74rem;
            font-weight: 700;
            line-height: 1.05;
            min-width: 0;
            overflow-wrap: break-word;
        }

        .team-left {
            text-align: right;
        }

        .team-right {
            text-align: left;
        }

        .resultado-input {
            width: 30px;
            height: 28px;
            padding: 0 !important;
            text-align: center;
            font-weight: 600;
            font-size: 0.68rem !important;
            line-height: 1;
            appearance: textfield;
        }

        .resultado-input::-webkit-outer-spin-button,
        .resultado-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .match-actions .btn {
            height: 32px;
            font-size: 0.78rem;
            padding: 4px 8px;
        }

        .match-actions {
            margin-top: 10px;
        }

        .sin-goleadores {
            color: #6c757d;
            text-align: center;
            font-weight: 600;
        }

        .pagado-box {
            width: 100%;
            height: 30px;
            display: flex;
            align-items: center;
        }

        .pagado-check {
            width: 100% !important;
            height: 30px !important;
            max-width: 100%;
            cursor: pointer;
        }

        .bombo-card {
            border: 1px solid #dfe5ec;
            border-radius: 8px;
            background: #f8fbfd;
            padding: 10px 12px;
            min-height: 145px;
        }

        .bombo-card h6 {
            text-align: center;
            color: #0d6efd;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 0;
        }

        .bombo-card p {
            text-align: center;
            font-size: 0.58rem;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .bombo-grid .bombo-checkbox-list {
            display: grid !important;
            grid-template-columns: repeat(2, max-content);
            grid-template-rows: repeat(4, auto);
            justify-content: center;
            column-gap: 55px;
            row-gap: 6px;
        }

        .bombo-grid .bombo-checkbox-list > div {
            min-width: 0;
        }

        .bombo-grid label {
            display: flex !important;
            align-items: center;
            gap: 5px;
            font-size: 0.68rem;
            font-weight: 600;
            line-height: 1.1;
            white-space: nowrap;
            cursor: pointer;
        }

        .bombo-grid input[type="checkbox"] {
            width: 12px !important;
            height: 12px !important;
            margin: 0 !important;
            cursor: pointer;
            accent-color: #0d6efd;
        }

        .bombo-grid input[type="checkbox"]:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .bombo-grid label::before {
            content: "";
            width: 16px;
            height: 11px;
            display: inline-block;
            background-size: cover;
            background-position: center;
            border: 1px solid #ddd;
            flex: 0 0 auto;
        }

        .leyenda-grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 4px 6px;
        }

        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.58rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            border: 1px solid #dfe5ec;
            border-radius: 4px;
            padding: 3px 4px;
            background: #f8fbfd;
        }

        .leyenda-item img,
        .equipo-mini img {
            width: 16px;
            height: 11px;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        .leyenda-nombre {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .leyenda-codigo {
            margin-left: auto;
            color: #0d6efd;
            font-weight: 700;
        }

        .apuestas-table {
            font-size: 0.68rem;
        }

        .apuestas-table th {
            font-size: 0.7rem;
            font-weight: 700;
        }

        .apuestas-table td {
            padding: 4px 5px;
        }

        .equipo-mini {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-weight: 700;
            white-space: nowrap;
        }

        .edit-mini {
            width: 26px;
            height: 24px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-app {
            min-width: 120px;
            height: 34px;
            font-size: 0.82rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .puntuaciones-table {
            table-layout: fixed;
            width: 100%;
        }

        .puntuaciones-table th,
        .puntuaciones-table td {
            text-align: center;
            vertical-align: middle;
        }

        .puntuaciones-table th:first-child,
        .puntuaciones-table td:first-child {
            width: 28%;
            text-align: center;
        }

        .puntuaciones-table th:not(:first-child),
        .puntuaciones-table td:not(:first-child) {
            width: 8%;
        }

        .puntuaciones-table td:first-child .equipo-mini {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .fase-inactiva {
            background-color: #e9ecef !important;
            color: #adb5bd !important;
            font-style: italic;
        }

        @media (max-width: 768px) {
        .leyenda-card {
            display: none;
        }

        .apuestas-mobile {
            display: none;
        }

        @media (max-width: 768px) {
            .apuestas-table-card {
                display: none;
            }

            .apuestas-mobile {
                display: block;
            }
        }
    }
    </style>
    {% load static %}

    <meta charset="UTF-8">

    <title>
        Euro-Mundial Porra{% block titulo_pagina %}{% endblock %}
    </title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const tooltipTriggerList = document.querySelectorAll(
        '[data-bs-toggle="tooltip"]'
    );

    [...tooltipTriggerList].forEach(function (tooltipTriggerEl) {
        new bootstrap.Tooltip(tooltipTriggerEl);
    });

});
</script>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'inicio' %}">
            <span>Euro-Mundial Porra</span>
        </a>

        <a href="/admin/" class="btn btn-outline-light btn-sm">
            <i class="bi bi-person-gear"></i>
            Admin
        </a>
    </div>
</nav>

<main class="container py-4">
    {% block contenido %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
