{% extends 'apuestas/base.html' %}

{% block contenido %}

{% load static %}

<div class="text-center mb-4">

    <img
        src="{% static 'apuestas/img/logo.png' %}"
        alt="EuroMundialPorra"
        style="width:120px; height:auto;"
        class="mb-3"
    >

    <h1 class="fw-bold">
        EuroMundialPorra
    </h1>

</div>

<div class="row g-4">

    {% if request.user.is_staff %}
    <div class="col-md-3">
        <a href="{% url 'ver_apuestas' %}" class="text-decoration-none">
            <div class="card shadow-sm h-100 text-center">
                <div class="card-body">
                    <i class="bi bi-list-check display-4 text-success"></i>
                    <h5 class="mt-3 text-dark">Apuestas</h5>
                </div>
            </div>
        </a>
    </div>
    {% endif %}

    <div class="col-md-3">
        <a href="{% url 'resultados' %}" class="text-decoration-none">
            <div class="card shadow-sm h-100 text-center">
                <div class="card-body">
                    <i class="bi bi-calendar2-check display-4 text-warning"></i>
                    <h5 class="mt-3 text-dark">Resultados</h5>
                </div>
            </div>
        </a>
    </div>

    <div class="col-md-3">
        <a href="{% url 'clasificacion' %}" class="text-decoration-none">
            <div class="card shadow-sm h-100 text-center">
                <div class="card-body">
                    <i class="bi bi-bar-chart-fill display-4 text-danger"></i>
                    <h5 class="mt-3 text-dark">Clasificación</h5>
                </div>
            </div>
        </a>
    </div>

    <div class="col-md-3">
        <a href="{% url 'puntuaciones' %}" class="text-decoration-none">
            <div class="card shadow-sm h-100 text-center">
                <div class="card-body">
                    <i class="bi bi-calculator-fill display-4 text-info"></i>
                    <h5 class="mt-3 text-dark">Puntuaciones</h5>
                </div>
            </div>
        </a>
    </div>

</div>

{% endblock %}
